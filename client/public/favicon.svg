<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Dark gothic styled sword pointing diagonally from bottom-left to top-right -->
  
  <!-- Outer Glow / Ambient shadow for dark backgrounds -->
  <path d="M7 57 L57 7 L59 9 L9 59 Z" fill="none" stroke="#110909" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

  <!-- Blade -->
  <!-- Shadow/Dark Steel side -->
  <path d="M20 44 L51 13 L49 11 L18 42 Z" fill="#64748b"/>
  <!-- Highlight/Bright Steel side -->
  <path d="M22 46 L53 15 L51 13 L20 44 Z" fill="#cbd5e1"/>
  <!-- Blade Center Ridge (Fuller line) -->
  <path d="M20 44 L51 13" stroke="#334155" stroke-width="1.5"/>
  <!-- Blade Tip -->
  <path d="M51 13 L56 8 L53 15 Z" fill="#f1f5f9"/>

  <!-- Crossguard (Golden / Bronze) -->
  <!-- Left Wing -->
  <path d="M18 42 L11 35 C10 34 8 35 9 37 L14 42 Z" fill="#b45309"/>
  <path d="M18 42 L12 36 L14 38 L16 40 Z" fill="#f59e0b"/>
  <!-- Right Wing -->
  <path d="M22 46 L29 53 C30 54 32 53 31 51 L26 46 Z" fill="#b45309"/>
  <path d="M22 46 L28 52 L26 50 L24 48 Z" fill="#d97706"/>
  <!-- Guard Center Hub -->
  <rect x="17" y="41" width="6" height="6" rx="1.5" transform="rotate(-45 20 44)" fill="#d97706"/>
  <rect x="18" y="42" width="4" height="4" rx="1" transform="rotate(-45 20 44)" fill="#fbbf24"/>

  <!-- Crimson Gem in Crossguard Hub -->
  <circle cx="20" cy="44" r="2" fill="#991b1b"/>
  <circle cx="19.5" cy="43.5" r="0.8" fill="#f87171"/>

  <!-- Handle (Grip) -->
  <path d="M20 44 L11 53" stroke="#451a03" stroke-width="4" stroke-linecap="round"/>
  <path d="M20 44 L11 53" stroke="#78350f" stroke-width="2" stroke-dasharray="2 2" stroke-linecap="round"/>

  <!-- Golden Pommel -->
  <circle cx="10" cy="54" r="3.5" fill="#b45309"/>
  <circle cx="10" cy="54" r="2" fill="#fbbf24"/>
  <circle cx="9.5" cy="53.5" r="0.8" fill="#fff"/>
</svg>